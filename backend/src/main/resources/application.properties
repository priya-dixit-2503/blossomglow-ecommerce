# ==========================================================
# BlossomGlow Candle Creations - Spring Boot Configuration
# ==========================================================
server.port=${SERVER_PORT:8080}

# Spring Application Name
spring.application.name=blossomglow-candle-backend

# MySQL Database Configuration using Environment Variables with fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blossomglow_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Defer DataSource script execution until after Hibernate initializes entity mappings
spring.jpa.defer-datasource-initialization=true

# SQL Initialization (creates tables and initial seeds)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Virtual Threads Support (Disabled by default for Java 17 LTS compatibility, enable on Java 21+ via env)
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:false}

# JWT Authentication Configuration
blossomglow.jwt.secret=${JWT_SECRET:blossomglowSecretKey2026MustBeAtLeast32BytesLongForHmacSha256!}
blossomglow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Credentials via Environment Variables
blossomglow.admin.username=${ADMIN_USERNAME:admin}
blossomglow.admin.password=${ADMIN_PASSWORD:blossomglow2026!}
blossomglow.admin.email=${ADMIN_EMAIL:admin@blossomglow.com}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.run.app}

# OpenAPI / Swagger Documentation Path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
