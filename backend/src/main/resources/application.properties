# BlossomGlow Candle Creations - Spring Boot Configuration
server.port=8080

# Spring Application Name
spring.application.name=blossomglow-candle-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/blossomglow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization (creates tables and initial seeds)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Java 21 Virtual Threads Support (High Concurrency)
spring.threads.virtual.enabled=true

# Security Configuration
blossomglow.admin.username=admin
blossomglow.admin.password=blossomglow2026!

# CORS Allowed Origins
cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://*.run.app
